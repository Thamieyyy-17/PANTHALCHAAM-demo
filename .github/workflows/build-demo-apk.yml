
name: Build PANTHALCHAAM Local Demo APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Verify local demo files
        run: node scripts/verify-demo.mjs

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build offline web app
        run: npm run build

      - name: Add Android project
        run: npx cap add android

      - name: Generate Android launcher assets
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android

      - name: Add PANTHALCHAAM notification sound and app label
        run: node scripts/prepare-android.mjs

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PANTHALCHAAM-LOCAL-DEMO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
